<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>原理图紧凑排版 · 真实对比</title><style>body{font:15px/1.6 system-ui;margin:20px;color:#20352a;background:#f3f6f5}h1{font-size:24px}button,select{font:inherit;padding:5px 10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.frame{height:72vh;overflow:auto;background:white;border:1px solid #bdcec3}img{display:block;max-width:none}h2{font-size:17px}a{color:#165d3b}.note{padding:10px 14px;background:white;border:1px solid #d1ddd5;margin:12px 0}</style><h1>原理图紧凑排版 · 仅 EDA skill / 加入算法</h1><div class="note">66 个真实元件 · 209 个引脚 · 同电气意图与字号 · 两版均实际保存、重载、回读<br>折点 125 → 18，整体内容包络约缩小一半；第 2、3 页线长增加，详见说明。原生严格门禁仍有告警，未做 PCB 或硬件验证。</div><select id="pick"><option value="1">01 主控与调试</option><option value="2">02 电源与采样</option><option value="3">03 运动与传感器</option></select> <button id="fit">共同适合窗口</button> <button id="actual">共同原始比例</button><div class="pair"><section><h2>仅 easyeda-agent 绘图 skill</h2><div class="frame"><img id="before" alt="仅EDA skill真实图"></div></section><section><h2>加入 schematic-layout-optimizer</h2><div class="frame"><img id="after" alt="算法后真实图"></div></section></div><p><a href="README.md">方法、逐页指标与局限</a> · <a href="before.epro2">基线原生工程</a> · <a href="after.epro2">算法后原生工程</a></p><script>const widths={"before": [1676.0, 1191.0, 1676.0], "after": [1191.0, 1191.0, 1191.0]},pick=document.querySelector('#pick');let fitted=true;function update(){const n=pick.value;for(const s of ['before','after'])document.querySelector('#'+s).src=s+'-'+n+'.svg';scale()}function scale(){const i=Number(pick.value)-1,f=document.querySelector('.frame').clientWidth;const ratio=fitted?Math.min(f/widths.before[i],f/widths.after[i]):1;for(const s of ['before','after'])document.querySelector('#'+s).style.width=widths[s][i]*ratio+'px'}pick.onchange=update;document.querySelector('#fit').onclick=()=>{fitted=true;scale()};document.querySelector('#actual').onclick=()=>{fitted=false;scale()};window.onresize=scale;update();</script></html>
